<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Faixa do checkout — O Construtor Leigo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@600&display=swap">
<style>
/* Faixa usada no alto da tela de pagamento da Kiwify (é fotografada em tela cheia). */
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 30% 40%,#1E3F7A 0%,#13294B 45%,#0A1630 100%);display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Sans",system-ui,sans-serif}
.caixa{display:flex;align-items:center;gap:5vw;width:90vw}
img{height:78vh;border-radius:1.2vh;box-shadow:0 3vh 7vh rgba(0,0,0,.55)}
h1{margin:0;font:800 9vw/0.95 "Bricolage Grotesque",system-ui,sans-serif;color:#fff;letter-spacing:-.02em}
h1 span{color:#F2B33D}
.preco{margin-top:4vh;font:800 7vw/1 "Bricolage Grotesque",system-ui,sans-serif;color:#fff}
.linha{margin-top:2.5vh;font-size:2.6vw;color:#C9D4E5}
</style></head>
<body><div class="caixa">
  <img src="capa.jpg" alt="Capa do livro O Construtor Leigo">
  <div>
    <h1>O Construtor <span>Leigo</span></h1>
    <div class="preco">R$ 19,90</div>
    <div class="linha">Livro digital (PDF) · chega na hora no seu e-mail</div>
  </div>
</div></body></html>
